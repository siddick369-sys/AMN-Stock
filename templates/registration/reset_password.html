<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — AMN Stock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height:100vh;
      background:linear-gradient(135deg,#0d47a1 0%,#1565c0 50%,#e65100 100%);
      display:flex; align-items:center; justify-content:center; padding:1rem;
    }
    .auth-card { width:100%; max-width:440px; border:none; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .auth-header { background:#0d47a1; color:#fff; border-radius:16px 16px 0 0; padding:1.75rem 2rem; text-align:center; }
    .auth-header .logo-circle {
      width:66px; height:66px; background:rgba(255,255,255,.15); border-radius:50%;
      display:flex; align-items:center; justify-content:center; margin:0 auto .9rem; font-size:1.8rem;
    }
    .form-control:focus { border-color:#0d47a1; box-shadow:0 0 0 .25rem rgba(13,71,161,.2); }
    .btn-amn { background:#0d47a1; border-color:#0d47a1; color:#fff; }
    .btn-amn:hover { background:#1565c0; border-color:#1565c0; color:#fff; }
    #pwd-strength-bar { height:4px; border-radius:2px; transition:width .3s,background .3s; width:0; }
    .strength-weak   { background:#f44336; }
    .strength-fair   { background:#ff9800; }
    .strength-good   { background:#4caf50; }
    .strength-strong { background:#1b5e20; }
    /* Requirements checklist */
    .req { font-size:.8rem; color:#888; transition:color .2s; }
    .req.ok  { color:#2e7d32; }
    .req.ok::before  { content:'✓ '; }
    .req.bad::before { content:'✗ '; color:#f44336; }
  </style>
</head>
<body>
  <div class="auth-card card">
    <div class="auth-header">
      <div class="logo-circle"><i class="bi bi-lock-fill"></i></div>
      <h4 class="mb-0 fw-bold">Nouveau mot de passe</h4>
      <p class="mb-0 opacity-75 small">Choisissez un mot de passe sécurisé</p>
    </div>

    <div class="card-body p-4">

      {% if errors %}
      <div class="alert alert-danger py-2 small">
        <ul class="mb-0 ps-3">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
      </div>
      {% endif %}

      <form method="post" id="reset-form" novalidate>
        {% csrf_token %}

        <div class="mb-2">
          <label class="form-label fw-semibold small">Nouveau mot de passe <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" id="pwd" class="form-control"
                   placeholder="8 caractères minimum" autocomplete="new-password" required autofocus>
            <button type="button" class="btn btn-outline-secondary" id="toggle-pwd">
              <i class="bi bi-eye-fill" id="pwd-eye"></i>
            </button>
          </div>
          <div class="mt-1 bg-light rounded" style="height:4px;">
            <div id="pwd-strength-bar"></div>
          </div>
          <div class="mt-1">
            <span class="req" id="req-len">Au moins 8 caractères</span> &nbsp;
            <span class="req" id="req-mix">Majuscule + minuscule</span> &nbsp;
            <span class="req" id="req-num">Un chiffre</span>
          </div>
        </div>

        <div class="mb-4 mt-3">
          <label class="form-label fw-semibold small">Confirmer <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password2" id="pwd2" class="form-control"
                   placeholder="Répétez le mot de passe" autocomplete="new-password" required>
          </div>
          <div class="form-text text-danger d-none" id="pwd-mismatch">
            <i class="bi bi-x-circle-fill me-1"></i>Les mots de passe ne correspondent pas.
          </div>
        </div>

        <button type="submit" class="btn btn-amn w-100 fw-semibold py-2" id="submit-btn">
          <i class="bi bi-check2-circle me-2"></i>Enregistrer le nouveau mot de passe
        </button>
      </form>
    </div>

    <div class="card-footer text-center text-muted small py-3 border-0">
      &copy; {% now "Y" %} Africa Mobile Networks
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // ── Toggle visibility ──
  document.getElementById('toggle-pwd')?.addEventListener('click', () => {
    const inp = document.getElementById('pwd');
    const ico = document.getElementById('pwd-eye');
    inp.type  = inp.type === 'password' ? 'text' : 'password';
    ico.className = inp.type === 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill';
  });

  // ── Live requirements check ──
  const pwd  = document.getElementById('pwd');
  const bar  = document.getElementById('pwd-strength-bar');
  const reqLen = document.getElementById('req-len');
  const reqMix = document.getElementById('req-mix');
  const reqNum = document.getElementById('req-num');

  pwd.addEventListener('input', function() {
    const v = this.value;
    const okLen = v.length >= 8;
    const okMix = /[A-Z]/.test(v) && /[a-z]/.test(v);
    const okNum = /[0-9]/.test(v);

    reqLen.className = 'req ' + (v.length === 0 ? '' : okLen ? 'ok' : 'bad');
    reqMix.className = 'req ' + (v.length === 0 ? '' : okMix ? 'ok' : 'bad');
    reqNum.className = 'req ' + (v.length === 0 ? '' : okNum ? 'ok' : 'bad');

    let score = [okLen, okMix, okNum, v.length >= 12, /[^A-Za-z0-9]/.test(v)].filter(Boolean).length;
    const levels = [
      {p:'20%', c:'strength-weak'},
      {p:'40%', c:'strength-fair'},
      {p:'60%', c:'strength-fair'},
      {p:'80%', c:'strength-good'},
      {p:'100%',c:'strength-strong'},
    ];
    const l = levels[Math.max(0, score - 1)];
    bar.style.width = v.length ? l.p : '0';
    bar.className   = v.length ? l.c : '';
  });

  // ── Match check ──
  document.getElementById('pwd2')?.addEventListener('input', function() {
    document.getElementById('pwd-mismatch')
      .classList.toggle('d-none', !this.value || this.value === pwd.value);
  });
  </script>
</body>
</html>
