<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — AMN Stock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #e65100 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .login-header {
      background: #0d47a1;
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
    }
    .login-header .logo-circle {
      width: 72px; height: 72px;
      background: rgba(255,255,255,.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 2rem;
    }
    .form-control:focus { border-color: #0d47a1; box-shadow: 0 0 0 .25rem rgba(13,71,161,.25); }
    .btn-amn { background: #0d47a1; border-color: #0d47a1; color: #fff; }
    .btn-amn:hover { background: #1565c0; border-color: #1565c0; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <div class="logo-circle"><i class="bi bi-phone-fill"></i></div>
      <h4 class="mb-0 fw-bold">AMN Stock</h4>
      <p class="mb-0 opacity-75 small">Africa Mobile Networks — Gestion de Stock</p>
    </div>
    <div class="card-body p-4">
      <h5 class="text-center mb-4 fw-semibold text-muted">Connexion à votre compte</h5>

      {% if form.errors %}
      <div class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Identifiants incorrects. Veuillez réessayer.
      </div>
      {% endif %}

      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="username" class="form-control"
                   placeholder="votre_identifiant" autofocus autocomplete="username"
                   value="{{ form.username.value|default_if_none:'' }}" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="btn btn-outline-secondary" id="toggle-pwd">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-amn w-100 fw-semibold py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>
      </form>
    </div>
    <div class="card-footer text-center text-muted small py-3 border-0">
      &copy; {% now "Y" %} Africa Mobile Networks
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('toggle-pwd')?.addEventListener('click', function() {
      const pwd = document.querySelector('input[name=password]');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash-fill';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye-fill';
      }
    });
  </script>
</body>
</html>
