{% extends "base.html" %}

{% block title %}404 - Page non trouvée{% endblock %}
{% block page_title %}Erreur 404{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center h-100 text-center py-5">
    <i class="bi bi-compass text-secondary" style="font-size: 5rem; margin-bottom: 1rem;"></i>
    <h1 class="display-3 fw-bold text-primary">404</h1>
    <h3 class="fw-semibold text-dark">Page introuvable</h3>
    <p class="text-muted lead mb-4">La page que vous recherchez n'existe pas ou a été déplacée.</p>
    <a href="/" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">
        <i class="bi bi-house-door me-2"></i>Retour à l'accueil
    </a>
</div>
{% endblock %}
