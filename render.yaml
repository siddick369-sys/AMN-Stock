################################################################################
# render.yaml — Infrastructure-as-Code pour Render.com
# Doc : https://render.com/docs/infrastructure-as-code
#
# Base de données : NeonDB (PostgreSQL serverless externe — neon.tech)
# Cache           : LocMemCache (local à l'instance)
#
# Services Render :
#   1. amn-stock-web — Django / Gunicorn (Web Service, plan Free)
#
# ⚠️  Pas de workers Celery (migration vers Threading local effectuée).
#     Le cycle de stock est déclenché via /tasks/trigger-celery/ (cron-job.org).
#
# Variables à renseigner dans le Dashboard Render (sync: false) :
#
#   DATABASE_URL          → NeonDB pooled
#                           postgresql://user:pass@ep-xxx-pooler.region.neon.tech/db?sslmode=require
#   SECRET_KEY            → chaîne aléatoire (min 50 chars)
#   CRON_TRIGGER_TOKEN    → token hex 64 chars
#                           générer : python -c "import secrets; print(secrets.token_hex(32))"
#   EMAIL_HOST_USER       → login SMTP Brevo
#   EMAIL_HOST_PASSWORD   → clé API SMTP Brevo
#   DEFAULT_FROM_EMAIL    → ex: noreply@amn.africa
#   ADMIN_EMAIL           → ex: admin@amn.africa
#   GROQ_API_KEY          → console.groq.com/keys
#   GREENAPI_INSTANCE_ID / GREENAPI_TOKEN / GREENAPI_RECIPIENT → green-api.com
################################################################################

services:

  # ── 1. Application Web Django ───────────────────────────────────────────────
  - type: web
    name: amn-stock-web
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /login/
    envVars:

      # ── Sécurité ──
      - key: SECRET_KEY
        sync: false                          # ⚠️ OBLIGATOIRE — à saisir dans Dashboard

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "amn-stock-web.onrender.com"  # ⚠️ remplacer par votre domaine réel

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://amn-stock-web.onrender.com"  # ⚠️ idem

      # ── Base de données NeonDB ──
      # Aller sur neon.tech → votre projet → Connection Details
      # Choisir "Pooled connection" (recommandé pour gunicorn multi-workers)
      # Format : postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false                          # ⚠️ OBLIGATOIRE — URL NeonDB pooled

      # ── Email SMTP (Brevo recommandé) ──
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"

      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"

      - key: EMAIL_PORT
        value: "2525"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      # ── IA & Intégrations ──
      - key: GROQ_API_KEY
        sync: false

      - key: GREENAPI_INSTANCE_ID
        sync: false

      - key: GREENAPI_TOKEN
        sync: false

      - key: GREENAPI_RECIPIENT
        sync: false

      # ── App ──
      - key: LOW_STOCK_THRESHOLD
        value: "5"

      - key: FRONTEND_URL
        value: "https://amn-stock-web.onrender.com"  # ⚠️ remplacer par votre domaine

      # ── Cron Pseudo-Worker ──
      # Token hex 64 chars — générer : python -c "import secrets; print(secrets.token_hex(32))"
      # ⚠️  NE PAS utiliser de caractères spéciaux (# & ^ * {}) — ils cassent l'URL cron-job.org
      - key: CRON_TRIGGER_TOKEN
        sync: false                          # ⚠️ OBLIGATOIRE — à saisir dans Dashboard

      - key: PYTHON_VERSION
        value: "3.11.0"

# Pas de section "databases:" — la base de données est hébergée sur NeonDB (externe).
# Créer la base sur neon.tech et copier l'URL pooled dans DATABASE_URL ci-dessus.
