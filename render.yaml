################################################################################
# render.yaml — Infrastructure-as-Code pour Render.com
# Doc : https://render.com/docs/infrastructure-as-code
#
# Base de données : NeonDB (PostgreSQL serverless externe — neon.tech)
# Cache / Broker  : Upstash Redis (externe — upstash.com)
#
# Services Render :
#   1. amn-stock-web        — Django / Gunicorn  (Web Service)
#   2. amn-stock-celery     — Celery Worker       (Background Worker)
#   3. amn-stock-celery-beat— Celery Beat         (Background Worker)
#
# Variables à renseigner manuellement dans le Dashboard Render
# (marquées sync: false) AVANT le premier déploiement :
#
#   DATABASE_URL        → NeonDB → Connection string (mode "pooled")
#                         Format : postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/dbname?sslmode=require
#   CELERY_BROKER_URL   → Upstash → Redis URL
#                         Format : rediss://default:TOKEN@HOST:PORT
#   SECRET_KEY          → chaîne aléatoire longue (min 50 chars)
#   EMAIL_HOST_USER     → login SMTP Brevo
#   EMAIL_HOST_PASSWORD → mot de passe SMTP Brevo
#   DEFAULT_FROM_EMAIL  → ex: noreply@amn.africa
#   ADMIN_EMAIL         → ex: admin@amn.africa
#   GROQ_API_KEY        → console.groq.com/keys
#   GREENAPI_INSTANCE_ID / GREENAPI_TOKEN / GREENAPI_RECIPIENT → green-api.com
################################################################################

services:

  # ── 1. Application Web Django ───────────────────────────────────────────────
  - type: web
    name: amn-stock-web
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: >-
      gunicorn amn_stock.wsgi:application
      --workers 2
      --threads 2
      --timeout 120
      --bind 0.0.0.0:$PORT
      --access-logfile -
      --error-logfile -
    healthCheckPath: /login/
    envVars:

      # ── Sécurité ──
      - key: SECRET_KEY
        sync: false                          # ⚠️ OBLIGATOIRE — à saisir dans Dashboard

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "amn-stock-web.onrender.com"  # ⚠️ remplacer par votre domaine réel

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://amn-stock-web.onrender.com"  # ⚠️ idem

      # ── Base de données NeonDB ──
      # Aller sur neon.tech → votre projet → Connection Details
      # Choisir "Pooled connection" (recommandé pour gunicorn multi-workers)
      # Format : postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false                          # ⚠️ OBLIGATOIRE — URL NeonDB pooled

      # ── Redis Upstash (broker Celery + cache Django) ──
      # Aller sur upstash.com → votre Redis → Details → "Redis URL"
      # Format : rediss://default:TOKEN@HOST:PORT
      - key: CELERY_BROKER_URL
        sync: false                          # ⚠️ OBLIGATOIRE — URL Upstash

      # ── Email SMTP (Brevo recommandé) ──
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"

      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      # ── IA & Intégrations ──
      - key: GROQ_API_KEY
        sync: false

      - key: GREENAPI_INSTANCE_ID
        sync: false

      - key: GREENAPI_TOKEN
        sync: false

      - key: GREENAPI_RECIPIENT
        sync: false

      # ── App ──
      - key: LOW_STOCK_THRESHOLD
        value: "5"

      - key: FRONTEND_URL
        value: "https://amn-stock-web.onrender.com"  # ⚠️ remplacer par votre domaine

      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── 2. Celery Worker ─────────────────────────────────────────────────────────
  - type: worker
    name: amn-stock-celery
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: >-
      celery -A amn_stock worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
    envVars:

      - key: SECRET_KEY
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: SECRET_KEY

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: DATABASE_URL

      - key: CELERY_BROKER_URL
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: CELERY_BROKER_URL

      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"

      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_HOST_USER
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: EMAIL_HOST_USER

      - key: EMAIL_HOST_PASSWORD
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: EMAIL_HOST_PASSWORD

      - key: DEFAULT_FROM_EMAIL
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: DEFAULT_FROM_EMAIL

      - key: GROQ_API_KEY
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: GROQ_API_KEY

      - key: GREENAPI_INSTANCE_ID
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: GREENAPI_INSTANCE_ID

      - key: GREENAPI_TOKEN
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: GREENAPI_TOKEN

      - key: GREENAPI_RECIPIENT
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: GREENAPI_RECIPIENT

      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── 3. Celery Beat (planificateur) ───────────────────────────────────────────
  # ⚠️  Ne déployer qu'UNE SEULE instance de celery-beat — plusieurs instances
  #     provoqueraient l'exécution en double des tâches planifiées.
  - type: worker
    name: amn-stock-celery-beat
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: >-
      celery -A amn_stock beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:

      - key: SECRET_KEY
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: SECRET_KEY

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: DATABASE_URL

      - key: CELERY_BROKER_URL
        fromService:
          name: amn-stock-web
          type: web
          envVarKey: CELERY_BROKER_URL

      - key: PYTHON_VERSION
        value: "3.11.0"

# Pas de section "databases:" — la base de données est hébergée sur NeonDB (externe).
# Créer la base sur neon.tech et copier l'URL pooled dans DATABASE_URL ci-dessus.
